# XcodeGen tanımı: `xcodegen generate` → Dikiz.xcodeproj
name: Dikiz
options:
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "11"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Dikiz:
    type: application
    platform: macOS
    sources:
      - path: Dikiz.swift
      - path: Audio.swift
      - path: Preview.swift
      - path: Setup.swift
      - path: Resources/AppIcon.icns
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Dikiz
        PRODUCT_BUNDLE_IDENTIFIER: app.dikiz.mac
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Dikiz.entitlements
    dependencies:
      - target: DikizCamera
        embed: true
      # Sanal mikrofon sürücüsü uygulamanın içinde taşınır; kurulumda /Library/Audio/Plug-Ins/HAL'a kopyalanır.
      - target: DikizMikrofon
        embed: true
        codeSign: true
        copy:
          destination: resources
  DikizCamera:
    type: system-extension
    platform: macOS
    sources:
      - path: camera
        excludes: ["*.plist", "*.entitlements"]
    settings:
      base:
        PRODUCT_NAME: app.dikiz.mac.camera
        PRODUCT_BUNDLE_IDENTIFIER: app.dikiz.mac.camera
        INFOPLIST_FILE: camera/Info.plist
        CODE_SIGN_ENTITLEMENTS: camera/DikizCamera.entitlements
        SKIP_INSTALL: YES
  DikizMikrofon:
    type: bundle
    platform: macOS
    sources:
      - path: audio
        excludes: ["*.plist"]
    settings:
      base:
        PRODUCT_NAME: DikizMikrofon
        PRODUCT_BUNDLE_IDENTIFIER: app.dikiz.mac.mikrofon
        # Sürücünün kendi sürümü: yalnızca sürücü kodu değişince artır (kurulu olan eskiyse şifreyle güncellenir)
        DRIVER_VERSION: "2"
        INFOPLIST_FILE: audio/Info.plist
        WRAPPER_EXTENSION: driver
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        OTHER_LDFLAGS: ["-framework", "CoreAudio", "-framework", "CoreFoundation"]
